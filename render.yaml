# One-click hosting for the MedFinder API on Render (https://render.com).
# Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: medfinder-api
    runtime: node
    plan: free
    buildCommand: npm ci --workspace backend --include-workspace-root=false --omit=dev
    startCommand: npm start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@medfinder.gh
      - key: ADMIN_PASSWORD
        sync: false            # you type this in the Render dashboard
      - key: CORS_ORIGINS
        value: https://christosdaniel.github.io
      # Supabase Postgres connection string (Session pooler, port 5432). All data
      # lives in Supabase, so nothing is lost when Render restarts the server.
      # Supabase → Project Settings → Database → Connect → Session pooler.
      - key: DATABASE_URL
        sync: false            # you paste this in the Render dashboard
      # No demo data in production.
      - key: SEED_DEMO
        value: "false"
      # Shows the sign-up code in the app until an SMS provider is connected
      # (see backend/src/lib/sms.js). Set to "false" once SMS works.
      - key: EXPOSE_DEV_OTP
        value: "true"
